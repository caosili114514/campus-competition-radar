<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="赛讯雷达：校园竞赛信息聚合、核验与报名截止提醒。">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#4f46e5">
  <meta property="og:title" content="赛讯雷达 · 校园竞赛情报站">
  <meta property="og:description" content="聚合公开竞赛通知、报名窗口、来源核验与个人报名进度。">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <title>仪表盘 · 赛讯雷达</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content" data-action="skip-to-main">跳到主要内容</a>

  <div id="demo-banner" class="demo-banner" role="status" hidden>
    <div class="demo-banner-inner">
      <span class="demo-banner-label">演示数据</span>
      <span data-demo-banner-text>当前为演示数据模式，所有内容仅用于产品展示，不代表真实赛事或报名信息。</span>
    </div>
  </div>

  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="主导航">
      <a class="brand" href="#/dashboard" aria-label="赛讯雷达首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="36" height="36" fill="none" focusable="false">
            <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2.4" opacity=".28"/>
            <circle cx="24" cy="24" r="12" stroke="currentColor" stroke-width="2.4" opacity=".55"/>
            <circle cx="24" cy="24" r="4" fill="currentColor"/>
            <path d="M24 4v7M44 24h-7M24 44v-7M4 24h7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M34.8 13.2l-6.6 6.6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-copy">
          <strong>赛讯雷达</strong>
          <small>校园竞赛情报站</small>
        </span>
      </a>

      <nav class="primary-nav" aria-label="站点页面">
        <p class="nav-label">工作台</p>
        <ul>
          <li>
            <a class="nav-link" data-nav="dashboard" href="#/dashboard">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
              <span>仪表盘</span>
            </a>
          </li>
          <li>
            <a class="nav-link" data-nav="competitions" href="#/competitions">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4v2a4 4 0 0 0 4 4M17 6h3v2a4 4 0 0 1-4 4"/></svg>
              <span>竞赛发现</span>
              <span class="nav-count" data-nav-count="competitions" hidden></span>
            </a>
          </li>
          <li>
            <a class="nav-link" data-nav="my" href="#/my">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4.5L5 21V4.5a1 1 0 0 1 1-1Z"/></svg>
              <span>我的竞赛</span>
              <span class="nav-count" data-nav-count="my" hidden></span>
            </a>
          </li>
        </ul>

        <p class="nav-label">数据与说明</p>
        <ul>
          <li>
            <a class="nav-link" data-nav="sources" href="#/sources">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
              <span>信息源与运行</span>
            </a>
          </li>
          <li>
            <a class="nav-link" data-nav="about" href="#/about">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
              <span>关于与打开说明</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <p id="sidebar-data-status" class="sidebar-data-status">正在读取数据状态…</p>
        <p>原生 ES Modules · 无需构建</p>
      </div>
    </aside>

    <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="关闭导航菜单" data-action="close-mobile-nav" hidden></button>

    <div class="app-frame">
      <header class="topbar">
        <button id="mobile-menu-button" class="icon-button mobile-menu-button" type="button" aria-label="打开导航菜单" aria-controls="sidebar" aria-expanded="false" data-action="toggle-mobile-nav">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>

        <form id="global-search" class="global-search" role="search" action="#/competitions">
          <label class="sr-only" for="global-search-input">搜索竞赛</label>
          <div class="global-search-control">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input id="global-search-input" name="q" type="search" autocomplete="off" placeholder="搜索竞赛、主办方、关键词…">
            <button class="button button-primary search-submit" type="submit" aria-label="搜索竞赛">
              <span class="search-submit-label">搜索</span>
            </button>
          </div>
        </form>

        <div class="topbar-meta" aria-live="polite">
          <span id="data-mode-chip" class="mode-chip" hidden>数据模式</span>
          <span id="topbar-status-text" class="topbar-status-text">正在读取数据…</span>
        </div>
      </header>

      <main id="main-content" class="main-content" tabindex="-1">
        <div class="loading-state" role="status" aria-live="polite">
          <span class="loading-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" width="44" height="44" fill="none" focusable="false"><circle cx="24" cy="24" r="19" stroke="currentColor" stroke-width="2" opacity=".25"/><circle cx="24" cy="24" r="11" stroke="currentColor" stroke-width="2" opacity=".55"/><circle cx="24" cy="24" r="3.5" fill="currentColor"/><path d="M24 5v6M43 24h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <p>正在读取竞赛情报数据…</p>
          <p class="loading-hint">数据通过相对路径从 docs/data/ 加载。</p>
        </div>
      </main>
    </div>
  </div>

  <div id="route-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <div class="noscript-notice">
      <strong>需要启用 JavaScript</strong>
      <p>赛讯雷达使用原生 JavaScript 渲染。请启用 JavaScript，并在项目根目录运行 <code>npm run serve</code>（或 <code>python -m http.server 4173</code>），然后访问 <code>http://localhost:4173</code>。</p>
    </div>
  </noscript>
</body>
</html>
